<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#283848">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: http: data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https: http: data: blob:; img-src 'self' https: data: blob:;">
<title>個人資產儀表板</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#F2F4F7;--card:#FFFFFF;--ink:#1F2A37;--mut:#6B7785;--line:#E1E5EB;
  --slate:#283848;--slate2:#5B7A99;--org:#E8742A;--up:#D64545;--dn:#2E9E5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding-top:0;
  padding-bottom:64px;
  overscroll-behavior-y:contain;
}
a{color:inherit;text-decoration:none}

/* 頂部一體化吸附區塊 */
.top-sticky{
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
header{
  background:var(--slate);color:#fff;
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.brand small{font-size:11px;color:#cfd8e3;display:flex;align-items:center;gap:4px;margin-top:3px}
.brand input[type="date"]{
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:5px;padding:1px 6px;font-size:12px;width:auto;max-width:130px;text-align:center;
}
.top-acts{display:flex;gap:6px;align-items:center}
.top-btn{
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.top-btn.pri{background:var(--org);border-color:var(--org)}
.top-btn:active{transform:scale(.96)}

/* 狀態橫幅與 Toast */
#syncBar{
  background:#1e293b;color:#ffdfb8;font-size:12px;padding:6px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-top:1px solid rgba(255,255,255,.08);
}
#toast{
  position:fixed;bottom:68px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(31,42,55,.94);color:#fff;padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;
  transition:all .25s ease;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底部固定 5 欄導覽列 */
nav.bot-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;border-top:1px solid var(--line);
  padding:4px 4px;
  display:grid;grid-template-columns:repeat(5,1fr);
  box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
nav.bot-nav a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5px 0;border-radius:10px;color:var(--mut);font-size:11px;font-weight:600;gap:2px;
}
nav.bot-nav a i{font-style:normal;font-size:18px;line-height:1.1}
nav.bot-nav a.on{color:var(--org);background:rgba(232,116,42,.08)}

main{max-width:960px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}
.grid4 .card{margin:0;padding:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:720px){.grid2{grid-template-columns:repeat(2,1fr)}}
.grid2 .card{margin:0}

.kpi span{color:var(--mut);font-size:12px;display:block}
.kpi b{display:block;font-size:20px;color:var(--slate);margin:2px 0;letter-spacing:-.3px}
.kpi em{font-style:normal;font-size:11px;color:var(--mut);display:block}
.kpi em i{font-style:normal}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}

h3{margin:0 0 10px;font-size:15px;color:var(--slate);border-left:4px solid var(--org);padding-left:8px;display:flex;align-items:center;justify-content:space-between}
.hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.hd h3{margin:0}
.chip,.btn{
  border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;
  cursor:pointer;font-size:12px;font-weight:600;color:var(--slate);display:inline-flex;align-items:center;gap:4px;
}
.chip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.btn.pri{background:var(--org);color:#fff;border-color:var(--org);border-radius:8px;padding:8px 14px;font-size:13px}
.btn.sec{background:var(--slate);color:#fff;border-color:var(--slate);border-radius:8px;padding:8px 14px;font-size:13px}
.btn.out{border-color:var(--slate2);color:var(--slate);border-radius:8px;padding:8px 14px;font-size:13px}

.alloc{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:170px;flex:none}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:190px}
.leg a{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.leg s{width:10px;height:10px;border-radius:2px;flex:none}
.leg b{margin-left:auto}
.leg em{font-style:normal;color:var(--mut);width:48px;text-align:right;font-size:12px}

.bar{display:grid;grid-template-columns:105px 1fr 78px;gap:8px;align-items:center;margin:8px 0;font-size:12px}
.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar div{background:#EDF0F4;height:10px;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate);border-radius:5px}
.bar b{text-align:right}
.tip{font-size:12px;min-height:22px;margin-top:6px;padding:4px 8px;background:#f8fafc;border-radius:6px}
.mut{color:var(--mut)}
.empty-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:18px;text-align:center;color:var(--mut);font-size:13px;line-height:1.6}

/* 手機優化表格與首欄凍結 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:collapse;min-width:520px}
th{font-size:12px;color:var(--mut);text-align:right;font-weight:600;padding:7px 6px;white-space:nowrap}
td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{
  text-align:left;position:sticky;left:0;background:var(--card);z-index:2;
  box-shadow:2px 0 4px -2px rgba(0,0,0,.06);
}
input,select{
  font:15px/1.3 -apple-system,sans-serif;border:1px solid #cbd5e1;border-radius:8px;
  padding:7px 8px;background:#fff;width:100%;max-width:105px;text-align:right;
  transition:border-color .15s,box-shadow .15s;
}
.kb-input{background:#f8fafc;font-weight:600;color:var(--ink)}
.kb-input:focus{
  border-color:var(--org);background:#fffef8;outline:none;
  box-shadow:0 0 0 3px rgba(232,116,42,.22);
}
td small{color:var(--mut);font-size:11px}
u{font-size:10px;background:var(--org);color:#fff;border-radius:4px;padding:1px 4px;text-decoration:none}
u.tag-liab{background:#64748b;padding:1px 5px}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 8px}

.add{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
@media(min-width:600px){.add{display:flex;flex-wrap:wrap}}
.add input,.add select{max-width:none;text-align:left}
@media(min-width:600px){.add input,.add select{max-width:130px}}
.add .btn{grid-column:span 2;justify-content:center}
.sum{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:13px;align-items:center}
.sum b{color:var(--slate);font-size:15px}
.note{font-size:12px;color:var(--mut);margin:8px 0 0;line-height:1.5}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
.bk-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbfc;display:flex;flex-direction:column;gap:8px}
.bk-box h4{margin:0;font-size:14px;color:var(--slate)}
.bk-box p{margin:0;font-size:12px;color:var(--mut);flex:1}
textarea.code-box{width:100%;height:80px;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:#f8fafc;resize:vertical}
</style>
</head>
<body>

<div class="top-sticky">
  <header>
    <div class="brand">
      <h1>📊 資產儀表板</h1>
      <small>資料日 <input type="date" id="asof" data-p="asof" data-t="s"></small>
    </div>
    <div class="top-acts">
      <button class="top-btn" data-act="autoUpdate" id="topSyncBtn">🔄 更新報價</button>
      <button class="top-btn pri" data-act="snap">📸 存快照</button>
    </div>
  </header>
  <div id="syncBar">
    <span id="syncStatus">準備就緒</span>
    <span style="opacity:.8;font-size:11px;white-space:nowrap">鍵盤按「下一項」可跳格</span>
  </div>
</div>

<main id="app"></main>
<div id="toast"></div>
<input type="file" id="fi" accept=".json,.html,.htm,.txt" hidden>

<nav class="bot-nav">
  <a href="#dash" id="nav-dash"><i>📊</i><span>總覽</span></a>
  <a href="#stocks" id="nav-stocks"><i>📈</i><span>持股</span></a>
  <a href="#bank" id="nav-bank"><i>🏦</i><span>存款</span></a>
  <a href="#liab" id="nav-liab"><i>💳</i><span>負債</span></a>
  <a href="#backup" id="nav-backup"><i>⚙️</i><span>備份</span></a>
</nav>

<script>
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

// 通用版空白預設模板（所有金額、股數與歷史紀錄均已歸零，安全無個資）
const D0={
  "asof":todayStr(),
  "net":true,
  "stocks":[
    {"code":"0050","name":"元大台灣50","shares":0,"price":0,"prev":null,"lev":1},
    {"code":"2330","name":"台積電","shares":0,"price":0,"prev":null,"lev":1},
    {"code":"00679B","name":"元大美債20年","shares":0,"price":0,"prev":null,"lev":1}
  ],
  "dca":[
    {"code":"00662","name":"富邦NASDAQ","shares":0,"cost":0,"price":0,"monthly":0},
    {"code":"00878","name":"國泰永續高股息","shares":0,"cost":0,"price":0,"monthly":0}
  ],
  "dcaValue":0,
  "trust":{"name":"其他資產（信託/儲蓄險）","value":0},
  "banks":[
    {"name":"台幣主帳戶 (薪轉)","ccy":"TWD","bal":0,"rate":1,"incl":true},
    {"name":"台幣備用帳戶 (活存)","ccy":"TWD","bal":0,"rate":1,"incl":true},
    {"name":"外幣帳戶 (美元)","ccy":"USD","bal":0,"rate":32.0,"incl":true},
    {"name":"外幣帳戶 (日圓)","ccy":"JPY","bal":0,"rate":0.21,"incl":true}
  ],
  "liabs":[
    {"name":"房屋貸款","cat":"房貸","bal":0,"rate":2.185,"monthly":0,"incl":true},
    {"name":"汽車貸款","cat":"車貸","bal":0,"rate":2.5,"monthly":0,"incl":true},
    {"name":"就學貸款","cat":"學貸","bal":0,"rate":1.775,"monthly":0,"incl":true},
    {"name":"信用卡本期應繳","cat":"信用卡","bal":0,"rate":0,"monthly":0,"incl":true}
  ],
  "hist":[]
};

const KEY='twAssetDash.universal.v1';
const LIAB_CATS=['房貸','車貸','學貸','信用卡','信貸','其他'];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),
n0=v=>Math.round(Number(v)||0).toLocaleString('zh-TW'),
esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
num=(v,def=0)=>{const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:def},
pct=v=>(v>=0?'+':'')+(v*100).toFixed(2)+'%',cls=v=>v>0?'up':v<0?'dn':'',sg=v=>(v>=0?'+':'')+n0(v);

let toastTimer=null;
function showToast(msg,ms=2800){
 const t=$('#toast');if(!t)return;
 t.textContent=msg;t.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}

function sanitizeData(raw){
 if(!raw||typeof raw!=='object')return null;
 if(!Array.isArray(raw.stocks)||!Array.isArray(raw.banks))return null;
 return {
  asof:/^\d{4}-\d{2}-\d{2}$/.test(String(raw.asof||''))?String(raw.asof):todayStr(),
  net:Boolean(raw.net),
  stocks:raw.stocks.map(s=>({
   code:String(s.code||'').trim().toUpperCase().slice(0,15),
   name:String(s.name||s.code||'').trim().slice(0,40),
   shares:Math.max(0,num(s.shares,0)),
   price:Math.max(0,num(s.price,0)),
   prev:s.prev!=null?Math.max(0,num(s.prev,0)):null,
   lev:num(s.lev,1)>1?2:1
  })).filter(s=>s.code),
  dca:Array.isArray(raw.dca)?raw.dca.map(d=>({
   code:String(d.code||'').trim().toUpperCase().slice(0,15),
   name:String(d.name||d.code||'').trim().slice(0,40),
   shares:Math.max(0,num(d.shares,0)),
   cost:Math.max(0,num(d.cost,0)),
   price:Math.max(0,num(d.price,0)),
   monthly:Math.max(0,num(d.monthly,0))
  })).filter(d=>d.code):JSON.parse(JSON.stringify(D0.dca)),
  dcaValue:Math.max(0,num(raw.dcaValue,0)),
  trust:{
   name:String(raw.trust?.name||D0.trust.name).slice(0,40),
   value:Math.max(0,num(raw.trust?.value,0))
  },
  banks:raw.banks.map(b=>({
   name:String(b.name||'').trim().slice(0,40),
   ccy:['TWD','JPY','USD','EUR','CNY'].includes(String(b.ccy))?String(b.ccy):'TWD',
   bal:num(b.bal,0),
   rate:Math.max(0,num(b.rate,1)),
   incl:Boolean(b.incl)
  })).filter(b=>b.name),
  liabs:Array.isArray(raw.liabs)?raw.liabs.map(l=>({
   name:String(l.name||'').trim().slice(0,40),
   cat:LIAB_CATS.includes(String(l.cat))?String(l.cat):'其他',
   bal:Math.max(0,num(l.bal,0)),
   rate:Math.max(0,num(l.rate,0)),
   monthly:Math.max(0,num(l.monthly,0)),
   incl:l.incl===undefined?true:Boolean(l.incl)
  })).filter(l=>l.name):JSON.parse(JSON.stringify(D0.liabs)),
  hist:Array.isArray(raw.hist)?raw.hist.filter(r=>Array.isArray(r)&&/^\d{4}-\d{2}-\d{2}$/.test(String(r[0]))).map(r=>[String(r[0]),num(r[1]),num(r[2]),num(r[3]),num(r[4]),num(r[5]),num(r[6],0)]):[]
 };
}

function setByPath(obj,path,val){
 const keys=String(path).split('.');
 let cur=obj;
 for(let i=0;i<keys.length-1;i++){
  const k=keys[i];
  if(k==='__proto__'||k==='constructor'||k==='prototype')return;
  if(cur==null||typeof cur!=='object'||!(k in cur))return;
  cur=cur[k];
 }
 const last=keys[keys.length-1];
 if(last==='__proto__'||last==='constructor'||last==='prototype')return;
 if(cur&&typeof cur==='object')cur[last]=val;
}

const IDB_NAME='AssetDashUniversalDB',IDB_STORE='backups';
function openIDB(){
 return new Promise((res)=>{
  if(!window.indexedDB)return res(null);
  const req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=e=>{
   const db=e.target.result;
   if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'id'});
  };
  req.onsuccess=()=>res(req.result);
  req.onerror=()=>res(null);
 });
}
async function saveIDBBackup(label='自動備份'){
 try{
  const db=await openIDB();if(!db)return;
  const tx=db.transaction(IDB_STORE,'readwrite'),st=tx.objectStore(IDB_STORE);
  const now=new Date();
  const ts=now.toISOString().slice(0,10)+' '+now.toTimeString().slice(0,8);
  st.put({id:'latest',ts,label,data:JSON.parse(JSON.stringify(S))});
  st.put({id:'log_'+Date.now(),ts,label,data:JSON.parse(JSON.stringify(S))});
  const allReq=st.getAllKeys();
  allReq.onsuccess=()=>{
   const keys=(allReq.result||[]).filter(k=>String(k).startsWith('log_')).sort();
   while(keys.length>8)st.delete(keys.shift());
  };
 }catch(e){}
}
async function getIDBBackups(){
 try{
  const db=await openIDB();if(!db)return[];
  return new Promise(res=>{
   const req=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAll();
   req.onsuccess=()=>res((req.result||[]).filter(x=>String(x.id).startsWith('log_')).sort((a,b)=>b.id.localeCompare(a.id)));
   req.onerror=()=>res([]);
  });
 }catch(e){return[]}
}

let S=null;
try{S=sanitizeData(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
if(!S)S=sanitizeData(D0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let RANGE='1Y',MODE='total',TP=null,isUpdating=false,wantManualToast=false,idbList=[];
const RG={'3M':92,'1Y':365,'3Y':1095,'全部':99999};

function getCats(){
 return [
  ['現金存款','cash','#AEBBC9','#bank'],
  ['股票ETF','stockV','#34495E','#stocks'],
  ['定期定額','dcaV','#5B7A99','#stocks'],
  [S.trust.name||'其他資產','trust','#E8742A','#stocks']
 ];
}

function netForPrice(s,price){
 const mv=s.shares*price;if(!S.net)return mv;
 const f=Math.max(s.shares>=1000?20:0,Math.floor(mv*0.001425*(s.code.startsWith('00')?0.2:0.6))),t=Math.floor(mv*0.001);
 return Math.max(0,mv-f-t);
}
function net(s){return{v:netForPrice(s,s.price)}}
function calc(){
 const stockV=S.stocks.reduce((a,s)=>a+net(s).v,0),
       auto=S.dca.length>0&&S.dca.every(d=>d.price>0)&&S.dca.some(d=>d.shares>0),
       dcaV=auto?S.dca.reduce((a,d)=>a+d.shares*d.price,0):S.dcaValue,
       cash=S.banks.filter(b=>b.incl).reduce((a,b)=>a+b.bal*b.rate,0),
       trust=S.trust.value,
       gross=cash+trust+stockV+dcaV,
       liabs=S.liabs||[],
       liabV=liabs.filter(l=>l.incl).reduce((a,l)=>a+l.bal,0),
       liabEx=liabs.filter(l=>!l.incl).reduce((a,l)=>a+l.bal,0),
       liabMo=liabs.reduce((a,l)=>a+l.monthly,0),
       liabWeightedRate=liabV>0?liabs.filter(l=>l.incl).reduce((a,l)=>a+l.bal*l.rate,0)/liabV:0;
 return{stockV,dcaV,cash,trust,dcaAuto:auto,gross,liabV,liabEx,liabMo,liabWeightedRate,total:gross-liabV};
}
function series(){
 const c=calc(),h=S.hist.filter(x=>x[0]!==S.asof);
 if(c.gross>0||c.liabV>0||S.hist.length>0){
  h.push([S.asof,c.total,c.cash,c.trust,c.stockV,c.dcaV,c.liabV]);
 }
 h.sort((a,b)=>a[0]<b[0]?-1:1);
 return h;
}

// 修正版圓餅圖：採用開放式 SVG 圓弧路徑 (<path>)，避免 12 點鐘接縫處突出變形
function donut(items,grossTotal,netTotal){
 const R=70;
 if(grossTotal<=0){
  return `<svg viewBox="0 0 200 200" class="donut"><circle r="${R}" cx="100" cy="100" fill="none" stroke="#E1E5EB" stroke-width="32"/><text x="100" y="96" text-anchor="middle" font-size="11" fill="#6B7785">淨資產</text><text x="100" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#6B7785">NT$ 0</text></svg>`;
 }
 let off=0;
 const paths=items.map(i=>{
  const f=i.v/grossTotal;
  if(f<=0)return '';
  if(f>=0.9999)return `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${i.c}" stroke-width="32"/>`;
  const a0=(off*2-0.5)*Math.PI,a1=((off+f)*2-0.5)*Math.PI;
  const x1=100+R*Math.cos(a0),y1=100+R*Math.sin(a0);
  const x2=100+R*Math.cos(a1),y2=100+R*Math.sin(a1);
  const large=f>0.5?1:0;
  off+=f;
  return `<path d="M ${x1.toFixed(3)} ${y1.toFixed(3)} A ${R} ${R} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)}" fill="none" stroke="${i.c}" stroke-width="32"/>`;
 }).join('');
 return `<svg viewBox="0 0 200 200" class="donut">${paths}<text x="100" y="96" text-anchor="middle" font-size="11" fill="#6B7785">淨資產</text><text x="100" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#34495E">${(netTotal/10000).toFixed(1)}萬</text></svg>`;
}

function trend(){
 const all=series(),cut=new Date(Date.parse(S.asof)-RG[RANGE]*864e5).toISOString().slice(0,10),h=all.filter(x=>x[0]>=cut);
 if(h.length<2){
  return `<div class="empty-box">📈 <b>尚無足夠歷史快照（至少需 2 個不同日期的紀錄）</b><br>請先至下方「📈 持股」、「🏦 存款」、「💳 負債」填寫您的資產（或至「⚙️ 備份」匯入既有備份檔），並點擊右上角「<b>📸 存快照</b>」，系統即會自動繪製專屬資產走勢圖！</div>`;
 }
 const W=680,H=240,L=46,T=10,B=22,R=8,t0=Date.parse(h[0][0]),t1=Date.parse(h[h.length-1][0]),X=d=>L+(Date.parse(d)-t0)/(t1-t0||1)*(W-L-R);
 let lo,hi;
 if(MODE==='total'){const v=h.map(x=>x[1]);lo=Math.min(...v);hi=Math.max(...v);const p=(hi-lo)*.08||1;lo-=p;hi+=p}else{lo=0;hi=Math.max(...h.map(x=>(x[2]+x[3]+x[4]+x[5])))*1.05||1}
 const Y=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);let g='';
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E1E5EB"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#6B7785">${(v/10000).toFixed(0)}萬</text>`}
 [0,.5,1].forEach(f=>{g+=`<text x="${L+f*(W-L-R)}" y="${H-6}" text-anchor="${f==0?'start':f==1?'end':'middle'}" font-size="10" fill="#6B7785">${new Date(t0+(t1-t0)*f).toISOString().slice(0,7)}</text>`});
 if(MODE==='total'){const pts=h.map(x=>X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1)).join(' ');
  g+=`<polygon points="${L},${H-B} ${pts} ${W-R},${H-B}" fill="#34495E" opacity=".12"/><polyline points="${pts}" fill="none" stroke="#34495E" stroke-width="2.2"/>`}
 else{const cols=['#AEBBC9','#E8742A','#34495E','#5B7A99'];let acc=h.map(()=>0);
  [2,3,4,5].forEach((k,j)=>{const lw=acc.slice();acc=acc.map((a,i)=>a+h[i][k]);
   const up=h.map((x,i)=>X(x[0]).toFixed(1)+','+Y(acc[i]).toFixed(1)),dn=h.map((x,i)=>X(x[0]).toFixed(1)+','+Y(lw[i]).toFixed(1)).reverse();
   g+=`<polygon points="${up.concat(dn).join(' ')}" fill="${cols[j]}"/>`})}
 g+=`<line id="vl" y1="${T}" y2="${H-B}" stroke="#E8742A" stroke-width="1.5" display="none"/>`;
 TP={h,X,W};
 return `<svg id="tr" viewBox="0 0 ${W} ${H}" width="100%" style="touch-action:pan-y">${g}</svg><div id="tip" class="tip mut">👆 手指左右滑過圖表可查看每日資產與負債明細</div>`;
}

function hover(){
 const s=$('#tr');if(!s||!TP)return;
 const mv=e=>{
  const r=s.getBoundingClientRect(),p=e.touches?e.touches[0].clientX:e.clientX,x=(p-r.left)/r.width*TP.W;
  let b=0,bd=1e9;TP.h.forEach((q,i)=>{const d=Math.abs(TP.X(q[0])-x);if(d<bd){bd=d;b=i}});
  const q=TP.h[b],lx=TP.X(q[0]),l=$('#vl');l.setAttribute('x1',lx);l.setAttribute('x2',lx);l.removeAttribute('display');
  const lbTxt=q[6]>0?`｜<span class="up">負債 -${n0(q[6])}</span>`:'';
  $('#tip').innerHTML=`<b>${esc(q[0])}</b> 淨資產 <b style="color:var(--org)">${n0(q[1])}</b><br><span class="mut">現金 ${n0(q[2])}｜其他 ${n0(q[3])}｜股票 ${n0(q[4])}｜定額 ${n0(q[5])}${lbTxt}</span>`;
 };
 s.onmousemove=mv;s.ontouchmove=mv;s.ontouchstart=mv;
}

function vDash(){
 const c=calc(),h=S.hist,last=h[h.length-1],base=last&&last[0]===S.asof?h[h.length-2]:last,
 d=base?c.total-base[1]:0,dp=base&&base[1]?d/base[1]:0,
 peak=h.length>0?Math.max(c.total,...h.map(x=>x[1])):c.total,dd=peak>0?c.total/peak-1:0,
 gTot=c.gross||1,items=getCats().map(k=>({n:k[0],v:Math.max(0,c[k[1]]),c:k[2],l:k[3]})),
 tops=S.stocks.map(s=>({n:s.name,v:net(s).v})).concat([{n:'定期定額帳戶',v:c.dcaV},{n:S.trust.name||'其他資產',v:c.trust}]).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,8),
 mx=tops[0]?.v||1,
 debtRatio=c.gross>0?(c.liabV/c.gross*100).toFixed(1):'0.0';

 const samplePrices=S.stocks.filter(s=>s.price>0).map(s=>`${esc(s.name)}(${s.price})`).slice(0,3).join('、');
 const topBars=tops.length>0?tops.map(t=>`<div class="bar"><span>${esc(t.n)}</span><div><i style="width:${Math.max(0,t.v/mx*100)}%"></i></div><b>${n0(t.v)}</b></div>`).join(''):`<div class="empty-box" style="padding:20px 12px">${samplePrices?`✅ 已自動同步最新股價：${samplePrices}<br>`:''}目前預設股數與存款為 0<br><a href="#stocks" style="color:var(--org);font-weight:700;display:inline-block;margin-top:6px">👉 點此前往「📈 持股」輸入股數</a> 或 <a href="#backup" style="color:var(--slate);font-weight:700">前往「⚙️ 備份」匯入資料</a></div>`;

 return `<div class="grid4">
 <div class="card kpi"><span>總資產淨值 (NT$)</span><b>${n0(c.total)}</b><em class="${cls(d)}">${base?`${sg(d)} (${pct(dp)})｜高點 ${pct(dd)}`:'尚未建立歷史快照比較'}</em></div>
 <a class="card kpi" href="#bank"><span>現金存款 ›</span><b>${n0(c.cash)}</b><em>佔毛資產 ${c.gross>0?(c.cash/gTot*100).toFixed(1):'0.0'}%</em></a>
 <a class="card kpi" href="#stocks"><span>投資部位 ›</span><b>${n0(c.gross-c.cash)}</b><em>佔毛資產 ${c.gross>0?((1-c.cash/gTot)*100).toFixed(1):'0.0'}%</em></a>
 <a class="card kpi" href="#liab"><span>總負債 ›</span><b class="${c.liabV>0?'up':''}">${c.liabV>0?'-'+n0(c.liabV):'0'}</b><em>負債比 ${debtRatio}%｜月繳 ${n0(c.liabMo)}</em></a></div>
 <div class="grid2"><div class="card"><h3>資產配置與負債扣減</h3><div class="alloc">${donut(items,c.gross,c.total)}<ul class="leg">${items.map(i=>`<li><a href="${i.l}"><s style="background:${i.c}"></s>${esc(i.n)}<b>${n0(i.v)}</b><em>${c.gross>0?(i.v/gTot*100).toFixed(1):'0.0'}%</em></a></li>`).join('')}<li><a href="#liab"><s style="background:var(--up)"></s>扣除總負債<b class="${c.liabV>0?'up':''}">${c.liabV>0?'-'+n0(c.liabV):'0'}</b><em>${debtRatio}%</em></a></li></ul></div></div>
 <div class="card"><h3>前八大資產部位</h3>${topBars}</div></div>
 <div class="card"><div class="hd"><h3>淨資產歷史走勢</h3><div>${Object.keys(RG).map(k=>`<button class="chip ${k===RANGE?'on':''}" data-act="range" data-v="${esc(k)}">${esc(k)}</button>`).join('')}<button class="chip ${MODE==='total'?'on':''}" data-act="mode" data-v="total">淨額</button><button class="chip ${MODE==='comp'?'on':''}" data-act="mode" data-v="comp">資產組成</button></div></div>${trend()}</div>`;
}

// ===== 四引擎極速報價系統（證交所 MIS 即時批次 + FinMind 直連 + 盤後批次 + Yahoo 備援） =====
function validPrice(p){const n=Number(p);return Number.isFinite(n)&&n>0&&n<1e7?Number(n.toFixed(2)):null;}

async function fetchViaProxy(targetUrl,timeout=5000){
 const proxies=[
  {u:`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,wrap:true},
  {u:`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,wrap:false},
  {u:`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,wrap:false}
 ];
 for(const p of proxies){
  try{
   const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),timeout);
   const r=await fetch(p.u,{signal:ctrl.signal});
   clearTimeout(tid);
   if(!r.ok)continue;
   const j=await r.json();
   const res=p.wrap?JSON.parse(j.contents):j;
   if(res)return res;
  }catch(e){}
 }
 return null;
}

// 引擎 1（盤中即時首選）：台灣證交所 MIS 官方即時行情批次 API
async function fetchTwseMisRealtimeBatch(codes){
 if(!Array.isArray(codes)||codes.length===0)return {};
 const exCh=[];
 codes.forEach(c=>{
  const code=String(c).trim().toUpperCase();
  if(/B$/i.test(code)){
   exCh.push(`otc_${code}.tw`,`tse_${code}.tw`);
  }else{
   exCh.push(`tse_${code}.tw`,`otc_${code}.tw`);
  }
 });
 const u=`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${exCh.join('|')}&json=1&delay=0&_=${Date.now()}`;
 const d=await fetchViaProxy(u,5500);
 const out={};
 if(d&&Array.isArray(d.msgArray)){
  d.msgArray.forEach(item=>{
   const code=String(item.c||'').trim().toUpperCase();
   if(!code)return;
   const prev=validPrice(item.y);
   let price=validPrice(item.z);
   if(!price&&item.b){price=validPrice(String(item.b).split('_')[0]);}
   if(!price&&item.a){price=validPrice(String(item.a).split('_')[0]);}
   if(!price)price=validPrice(item.o)||prev;
   const rawD=String(item.d||'').trim();
   const dt=/^\d{8}$/.test(rawD)?`${rawD.slice(0,4)}-${rawD.slice(4,6)}-${rawD.slice(6,8)}`:todayStr();
   if(price){
    out[code]={date:dt,close:price,metaPrev:prev};
   }
  });
 }
 return out;
}

// 引擎 2（歷史序列首選）：FinMind 台股日線 API
async function fetchFinMindSeries(code,startDate){
 try{
  const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),5500);
  const r=await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${encodeURIComponent(code)}&start_date=${encodeURIComponent(startDate)}`,{signal:ctrl.signal});
  clearTimeout(tid);
  if(!r.ok)return null;
  const d=await r.json();
  if(d&&Array.isArray(d.data)&&d.data.length>0){
   const list=d.data.map(row=>({date:String(row.date||''),close:validPrice(row.close)})).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.close);
   if(list.length>0)return list;
  }
 }catch(e){}
 return null;
}

// 引擎 3：Yahoo Finance v8
async function fetchYahooSeries(code){
 const suffixes=/B$/i.test(code)?['.TWO','.TW']:['.TW','.TWO'];
 for(const sfx of suffixes){
  const u=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(code+sfx)}?interval=1d&range=1mo&_=${Date.now()}`;
  const d=await fetchViaProxy(u,4500);
  const res=d?.chart?.result?.[0];
  if(!res)continue;
  const ts=res.timestamp||[],closes=res.indicators?.quote?.[0]?.close||[];
  const map={};
  for(let i=0;i<ts.length;i++){
   const p=validPrice(closes[i]);
   if(p){
    const dt=new Date((ts[i]+8*3600)*1000).toISOString().slice(0,10);
    map[dt]=p;
   }
  }
  const regP=validPrice(res.meta?.regularMarketPrice);
  if(regP){
   const regDt=res.meta?.regularMarketTime?new Date((res.meta.regularMarketTime+8*3600)*1000).toISOString().slice(0,10):todayStr();
   map[regDt]=regP;
  }
  const prevP=validPrice(res.meta?.chartPreviousClose||res.meta?.previousClose);
  const list=Object.keys(map).sort().map(dt=>({date:dt,close:map[dt],metaPrev:prevP}));
  if(list.length>0)return list;
 }
 return null;
}

// 引擎 4：證交所與櫃買中心官方盤後全市場收盤批次表
async function fetchTwseTpexBatch(){
 const pMap={};
 const [twse,tpex]=await Promise.all([
  fetchViaProxy('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',5500),
  fetchViaProxy('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes',5500)
 ]);
 const parseRocDate=s=>{
  const str=String(s||'').trim();
  if(/^\d{7}$/.test(str)){
   const y=Number(str.slice(0,3))+1911;
   return `${y}-${str.slice(3,5)}-${str.slice(5,7)}`;
  }
  return null;
 };
 if(Array.isArray(twse)){
  twse.forEach(x=>{
   const p=validPrice(String(x.ClosingPrice||'').replace(/,/g,''));
   const dt=parseRocDate(x.Date)||todayStr();
   if(x.Code&&p)pMap[String(x.Code).trim()]={date:dt,close:p};
  });
 }
 if(Array.isArray(tpex)){
  tpex.forEach(x=>{
   const c=String(x.SecuritiesCompanyCode||x.Code||'').trim();
   const p=validPrice(String(x.Close||'').replace(/,/g,''));
   const dt=parseRocDate(x.Date)||todayStr();
   if(c&&p)pMap[c]={date:dt,close:p};
  });
 }
 return pMap;
}

function mergePointIntoSeries(series,pt){
 if(!pt||!pt.date||!pt.close)return series||[];
 const arr=Array.isArray(series)?series.slice():[];
 const existing=arr.find(x=>x.date===pt.date);
 if(existing){
  existing.close=pt.close;
  if(pt.metaPrev)existing.metaPrev=pt.metaPrev;
 }else{
  arr.push({date:pt.date,close:pt.close,metaPrev:pt.metaPrev||null});
  arr.sort((a,b)=>a.date<b.date?-1:1);
 }
 return arr;
}

function pickPriceOnOrBefore(series,targetDate){
 if(!Array.isArray(series)||series.length===0)return null;
 let idx=-1;
 for(let i=series.length-1;i>=0;i--){
  if(series[i].date<=targetDate){idx=i;break;}
 }
 if(idx===-1)return null;
 return {
  date:series[idx].date,
  price:series[idx].close,
  prev:series[idx].metaPrev||(idx>0?series[idx-1].close:null)
 };
}

function applySeriesMapToState(seriesMap,targetDate){
 let updated=0,latestPriceDate='';
 S.stocks.forEach(s=>{
  const picked=pickPriceOnOrBefore(seriesMap[s.code.trim().toUpperCase()],targetDate);
  if(picked){
   s.price=picked.price;
   if(picked.prev)s.prev=picked.prev;
   if(picked.date>latestPriceDate)latestPriceDate=picked.date;
   updated++;
  }
 });
 S.dca.forEach(d=>{
  const picked=pickPriceOnOrBefore(seriesMap[d.code.trim().toUpperCase()],targetDate);
  if(picked){
   d.price=picked.price;
   if(picked.date>latestPriceDate)latestPriceDate=picked.date;
   updated++;
  }
 });
 return {updated,latestPriceDate};
}

async function autoUpdatePrices(silent=false,doBackfill=true){
 if(isUpdating){
  if(!silent){
   wantManualToast=true;
   showToast('⏳ 正在同步最新報價中，請稍候...');
  }
  return;
 }
 isUpdating=true;
 wantManualToast=!silent;
 const st=$('#syncStatus'),btn=$('#topSyncBtn');
 const targetDate=S.asof||todayStr();
 if(st)st.textContent=`⏳ 正在同步 ${targetDate} 即時報價...`;
 if(btn)btn.textContent='⏳ 同步中';

 try{
  const allCodes=Array.from(new Set([...S.stocks.map(s=>s.code.trim().toUpperCase()),...S.dca.map(d=>d.code.trim().toUpperCase())])).filter(Boolean);
  if(allCodes.length===0){
   await syncExchangeRates(silent);
   if(st)st.textContent='✅ 已完成匯率同步（目前無股票代碼）';
   return;
  }
  const lastHistDate=S.hist.length>0?S.hist[S.hist.length-1][0]:targetDate;
  const minBaseDate=lastHistDate<targetDate?lastHistDate:targetDate;
  const startDate=new Date(Date.parse(minBaseDate)-15*864e5).toISOString().slice(0,10);

  const seriesMap={};

  // 同時並行：(A) FinMind 直連抓歷史日線 + (B) 證交所 MIS 單一請求抓全體盤中即時報價
  const [,misMap]=await Promise.all([
   Promise.all(allCodes.map(async c=>{
    const fm=await fetchFinMindSeries(c,startDate);
    if(fm&&fm.length>0)seriesMap[c]=fm;
   })),
   fetchTwseMisRealtimeBatch(allCodes)
  ]);

  Object.keys(misMap).forEach(c=>{
   seriesMap[c]=mergePointIntoSeries(seriesMap[c],misMap[c]);
  });

  const firstPass=applySeriesMapToState(seriesMap,targetDate);
  if(firstPass.updated>0){
   save();render();
  }

  const missingToday=allCodes.filter(c=>{
   const ser=seriesMap[c];
   return !ser||ser.length===0||ser[ser.length-1].date<targetDate;
  });

  if(missingToday.length>0){
   const batchMap=await fetchTwseTpexBatch();
   missingToday.forEach(c=>{
    if(batchMap[c]&&batchMap[c].date<=targetDate){
     seriesMap[c]=mergePointIntoSeries(seriesMap[c],batchMap[c]);
    }
   });

   const stillMissing=allCodes.filter(c=>{
    const ser=seriesMap[c];
    return !ser||ser.length===0||ser[ser.length-1].date<targetDate;
   });
   for(let i=0;i<stillMissing.length;i+=2){
    const chunk=stillMissing.slice(i,i+2);
    await Promise.all(chunk.map(async c=>{
     const yh=await fetchYahooSeries(c);
     if(yh&&yh.length>0){
      yh.forEach(pt=>{seriesMap[c]=mergePointIntoSeries(seriesMap[c],pt);});
     }
    }));
   }
  }

  // 僅在已有至少 1 筆歷史快照時，才自動回補上次快照至今日之間的漏存交易日
  let backfilledDates=[];
  if(doBackfill&&S.hist.length>0&&lastHistDate<targetDate){
   const existingDates=new Set(S.hist.map(r=>r[0]));
   const dateCount={};
   Object.values(seriesMap).forEach(ser=>{
    ser.forEach(pt=>{
     if(pt.date>lastHistDate&&pt.date<targetDate&&!existingDates.has(pt.date)){
      dateCount[pt.date]=(dateCount[pt.date]||0)+1;
     }
    });
   });
   const threshold=Math.max(1,Math.floor(allCodes.length*0.3));
   const missedDates=Object.keys(dateCount).filter(d=>dateCount[d]>=threshold).sort();
   if(missedDates.length>0){
    const cashNow=Math.round(S.banks.filter(b=>b.incl).reduce((a,b)=>a+b.bal*b.rate,0));
    const trustNow=Math.round(S.trust.value);
    const liabNow=Math.round((S.liabs||[]).filter(l=>l.incl).reduce((a,l)=>a+l.bal,0));
    missedDates.forEach(dt=>{
     const stockV=Math.round(S.stocks.reduce((sum,s)=>{
      const picked=pickPriceOnOrBefore(seriesMap[s.code.trim().toUpperCase()],dt);
      const p=picked?picked.price:s.price;
      return sum+netForPrice(s,p);
     },0));
     const dcaPickedAll=S.dca.length>0&&S.dca.every(d=>pickPriceOnOrBefore(seriesMap[d.code.trim().toUpperCase()],dt)||d.price>0)&&S.dca.some(d=>d.shares>0);
     const dcaV=Math.round(dcaPickedAll?S.dca.reduce((sum,d)=>{
      const picked=pickPriceOnOrBefore(seriesMap[d.code.trim().toUpperCase()],dt);
      const p=picked?picked.price:d.price;
      return sum+d.shares*p;
     },0):S.dcaValue);
     const total=cashNow+trustNow+stockV+dcaV-liabNow;
     S.hist.push([dt,total,cashNow,trustNow,stockV,dcaV,liabNow]);
     backfilledDates.push(dt);
    });
    S.hist.sort((a,b)=>a[0]<b[0]?-1:1);
   }
  }

  const finalRes=applySeriesMapToState(seriesMap,targetDate);
  await syncExchangeRates(true);

  save();
  await saveIDBBackup(backfilledDates.length>0?`同步並補齊${backfilledDates.length}天`:'同步最新報價');
  const now=new Date().toTimeString().slice(0,8);
  const bfMsg=backfilledDates.length>0?` (補齊${backfilledDates.length}天)`:'';
  const dtBadge=finalRes.latestPriceDate?`｜價日 ${finalRes.latestPriceDate}`:'';
  if(st){
   st.textContent=finalRes.updated>0?`✅ ${now} 已同步 (${finalRes.updated}/${allCodes.length}檔${dtBadge})${bfMsg}`:'⚠️ 離線或無外部報價，可直接手動輸入';
  }
  if(wantManualToast){
   showToast(finalRes.updated>0?`✅ 已更新 ${finalRes.updated} 檔即時報價（價日：${finalRes.latestPriceDate||targetDate}）${bfMsg}`:'⚠️ 無法連線報價伺服器，請檢查網路');
  }
 }catch(e){
  if(st)st.textContent='⚠️ 自動更新失敗，可手動輸入';
  if(wantManualToast)showToast('⚠️ 更新發生錯誤，請檢查網路連線');
 }finally{
  isUpdating=false;
  wantManualToast=false;
  if(btn)btn.textContent='🔄 更新報價';
  render();
 }
}

async function fetchSingleCodePrice(code,targetDate){
 const c=String(code).trim().toUpperCase();
 const startDate=new Date(Date.parse(targetDate)-15*864e5).toISOString().slice(0,10);
 const [fm,mis]=await Promise.all([
  fetchFinMindSeries(c,startDate),
  fetchTwseMisRealtimeBatch([c])
 ]);
 let ser=fm||[];
 if(mis[c])ser=mergePointIntoSeries(ser,mis[c]);
 if(ser.length===0||ser[ser.length-1].date<targetDate){
  const yh=await fetchYahooSeries(c);
  if(yh&&yh.length>0)yh.forEach(pt=>{ser=mergePointIntoSeries(ser,pt);});
 }
 return pickPriceOnOrBefore(ser,targetDate);
}

async function snap(){
 const c=calc();
 S.hist=S.hist.filter(x=>x[0]!==S.asof);
 S.hist.push([S.asof,Math.round(c.total),Math.round(c.cash),Math.round(c.trust),Math.round(c.stockV),Math.round(c.dcaV),Math.round(c.liabV)]);
 S.hist.sort((a,b)=>a[0]<b[0]?-1:1);
 S.stocks.forEach(s=>s.prev=s.price);
 save();
 await saveIDBBackup(`手動快照 (${S.asof})`);
 render();
 showToast(`📸 已儲存 ${S.asof} 快照（淨資產 NT$ ${n0(c.total)}）`);
}

function exp(){
 const jsonStr=JSON.stringify(S,null,2);
 const fileName=`asset-data-${S.asof}.json`;
 try{
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(jsonStr);

  showToast('💾 已觸發下載 ' + fileName);

}

async function shareBackup(){
 const jsonStr=JSON.stringify(S,null,2);
 const fileName=`asset-data-${S.asof}.json`;
 try{
  if(navigator.canShare&&window.File){
   const file=new File([jsonStr],fileName,{type:'application/json'});
   if(navigator.canShare({files:[file]})){
    await navigator.share({
     title:`資產儀表板備份 (${S.asof})`,
     text:`淨資產 NT$ ${n0(calc().total)} 備份檔`,
     files:[file]
    });
    showToast('✅ 已開啟系統分享選單');
    return;
   }
  }
  if(navigator.share){
   await navigator.share({
    title:`資產儀表板備份 (${S.asof})`,
    text:jsonStr
   });
   showToast('✅ 已透過文字分享備份碼');
   return;
  }
 }catch(err){
  if(err&&err.name==='AbortError')return;
 }
 try{
  await navigator.clipboard.writeText(jsonStr);
  showToast('📋 您的環境不支援直接分享，已自動複製完整備份碼至剪貼簿！');
 }catch(e){
  exp();
 }
}

function jumpToNextInput(currentEl,reverse=false){
 const col=currentEl.dataset.col;
 const group=col?$$(`input[data-col="${col}"]`):$$('input.kb-input:not([disabled])');
 const idx=group.indexOf(currentEl);
 if(idx===-1)return;
 const nextIdx=reverse?idx-1:idx+1;
 if(nextIdx>=0&&nextIdx<group.length){
  const nextEl=group[nextIdx];
  nextEl.focus();
  setTimeout(()=>{try{nextEl.select()}catch(e){}},10);
 }else{
  currentEl.blur();
  showToast('✅ 該欄輸入完成並已自動儲存');
 }
}

document.addEventListener('input',e=>{
 const t=e.target,p=t.dataset.p;
 if(!p||t.type==='checkbox'||t.type==='date')return;
 const allowNeg=t.classList.contains('bal-input');
 const v=t.dataset.t==='n'?(allowNeg?num(t.value,0):Math.max(0,num(t.value,0))):String(t.value).trim();
 setByPath(S,p,v);
 save();
 updateLiveDOM();
});

document.addEventListener('keydown',e=>{
 const t=e.target;
 if(!t.classList.contains('kb-input'))return;
 if(e.key==='Enter'||e.key==='Tab'||e.keyCode===13){
  e.preventDefault();
  jumpToNextInput(t,e.shiftKey);
 }
});

document.addEventListener('change',e=>{
 const t=e.target,p=t.dataset.p;if(!p)return;
 if(t.type==='checkbox'){
  setByPath(S,p,t.checked);
  save();
  render();
 }else if(p==='asof'){
  const v=String(t.value).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){
   S.asof=v;save();render();
   autoUpdatePrices(false,false);
  }
 }
});

document.addEventListener('focusin',e=>{
 if(e.target.classList&&e.target.classList.contains('kb-input')){
  setTimeout(()=>{try{e.target.select()}catch(x){}},20);
 }
});

document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,v=t.dataset.v,f=id=>($('#'+id)?.value||'').trim();
 if(a==='range'){RANGE=v;render();}
 else if(a==='mode'){MODE=v;render();}
 else if(a==='del'){
  const k=String(t.dataset.p||'').split('.');
  if((k[0]==='stocks'||k[0]==='dca'||k[0]==='banks'||k[0]==='liabs')&&confirm('確定刪除這一筆項目？')){
   S[k[0]].splice(+k[1],1);save();render();showToast('🗑️ 已刪除項目');
  }
 }
 else if(a==='delHist'){
  const dt=t.dataset.dt;
  if(confirm(`確定刪除 ${dt} 的歷史快照？`)){
   S.hist=S.hist.filter(r=>r[0]!==dt);save();render();showToast(`🗑️ 已刪除 ${dt} 快照`);
  }
 }
 else if(a==='autoUpdate'||a==='backfill'){autoUpdatePrices(false,true);}
 else if(a==='syncFx'){syncExchangeRates(false);}
 else if(a==='addStock'){
  if(!f('ac')||!f('as'))return showToast('⚠️ 請至少填入股票代碼與股數');
  const code=f('ac').toUpperCase(),initP=Math.max(0,num(f('ap'),0));
  const newItem={code,name:f('an')||code,shares:Math.max(0,num(f('as'),0)),price:initP,prev:null,lev:/L$/i.test(code)?2:1};
  S.stocks.push(newItem);save();render();
  if(!initP){
   showToast(`⏳ 正在自動抓取 ${code} 報價...`);
   const picked=await fetchSingleCodePrice(code,S.asof);
   if(picked){
    newItem.price=picked.price;
    if(picked.prev)newItem.prev=picked.prev;
    save();render();showToast(`✅ 已填入 ${code} 股價 ${picked.price}`);
   }else showToast(`⚠️ 查無 ${code} 報價，請手動輸入`);
  }else showToast(`✅ 已新增 ${code}`);
 }
 else if(a==='addDca'){
  if(!f('dc_c'))return showToast('⚠️ 請填入定期定額股票代碼');
  const code=f('dc_c').toUpperCase();
  const newItem={
   code,
   name:f('dc_n')||code,
   shares:Math.max(0,num(f('dc_s'),0)),
   cost:Math.max(0,num(f('dc_cost'),0)),
   price:0,
   monthly:Math.max(0,num(f('dc_m'),0))
  };
  S.dca.push(newItem);save();render();
  showToast(`⏳ 正在自動抓取 ${code} 報價...`);
  const picked=await fetchSingleCodePrice(code,S.asof);
  if(picked){
   newItem.price=picked.price;
   save();render();showToast(`✅ 已新增定期定額 ${code}（現價 ${picked.price}）`);
  }else showToast(`✅ 已新增 ${code}，請手動填寫現價`);
 }
 else if(a==='addBank'){
  if(!f('bn'))return showToast('⚠️ 請填入帳戶名稱');
  const c=$('#bc').value;
  S.banks.push({name:f('bn'),ccy:c,bal:num(f('bb'),0),rate:c==='TWD'?1:Math.max(0,num(f('br'),1)),incl:true});
  save();render();showToast(`✅ 已新增 ${f('bn')} 帳戶`);
 }
 else if(a==='addLiab'){
  if(!f('ln'))return showToast('⚠️ 請填入負債項目名稱');
  const cat=$('#lc').value;
  S.liabs.push({
   name:f('ln'),
   cat,
   bal:Math.max(0,num(f('lb'),0)),
   rate:Math.max(0,num(f('lr'),0)),
   monthly:Math.max(0,num(f('lm'),0)),
   incl:true
  });
  save();render();showToast(`✅ 已新增負債項目：${f('ln')}`);
 }
 else if(a==='snap'){snap();}
 else if(a==='exp'){exp();}
 else if(a==='shareBackup'){shareBackup();}
 else if(a==='imp'){$('#fi').click();}
 else if(a==='copyClip'){
  const str=JSON.stringify(S);
  const box=$('#clipBox');if(box)box.value=str;
  try{await navigator.clipboard.writeText(str);showToast('📋 已複製完整備份碼至手機剪貼簿！');}
  catch(x){if(box){box.select();document.execCommand('copy');showToast('📋 已複製備份碼！');}}
 }
 else if(a==='restoreClip'){
  const raw=f('clipBox');
  if(!raw)return showToast('⚠️ 請先在上方文字框貼上備份碼');
  try{
   const clean=sanitizeData(JSON.parse(raw));
   if(!clean)throw new Error('bad');
   S=clean;save();await saveIDBBackup('剪貼簿還原');render();
   showToast(`✅ 還原成功！共載入 ${S.stocks.length} 檔持股與 ${S.hist.length} 筆歷史快照`);
  }catch(x){showToast('❌ 備份碼格式不正確，請確認內容是否完整');}
 }
 else if(a==='restoreIDB'){
  const item=idbList[+t.dataset.idx];
  if(item&&item.data&&confirm(`確定要還原至【${item.ts} (${item.label})】的備份狀態嗎？`)){
   const clean=sanitizeData(item.data);
   if(clean){S=clean;save();render();showToast('✅ 已從本機備份匣成功還原！');}
  }
 }
 else if(a==='reset'){
  if(confirm('確定要清空所有資料並還原為空白初始模板嗎？目前的紀錄將會被清除。')){
   S=sanitizeData(D0);save();render();
   autoUpdatePrices(false,false);
  }
 }
});

// 支援匯入 .json 備份檔，或直接選擇您原本含有個人歷史紀錄的 .html 儀表板檔案無損匯入
$('#fi').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=async()=>{
  try{
   let txt=String(r.result||'').trim(),parsed=null;
   if(txt.startsWith('{')){
    parsed=JSON.parse(txt);
   }else{
    const m=txt.match(/const\s+D0\s*=\s*(\{[\s\S]*?\});/);
    if(m)parsed=JSON.parse(m[1]);
   }
   const clean=sanitizeData(parsed);
   if(!clean)throw new Error('Invalid format');
   S=clean;save();await saveIDBBackup('檔案匯入');render();
   showToast(`✅ 匯入成功！共載入 ${S.hist.length} 筆歷史快照`);
   autoUpdatePrices(true,true);
  }catch(x){
   alert('檔案格式不正確，請選擇匯出的 .json 備份檔或原始的 .html 儀表板檔案。');
  }
 };
 r.readAsText(f);e.target.value='';
});
